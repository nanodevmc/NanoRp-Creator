name: NanoRp-Creator Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ========================================================
  # JOB 1: WINDOWS INDEPENDENT BUILD & DIRECT RELEASE
  # ========================================================
  build-windows:
    name: Windows x64 (NSIS & Portable)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust-engine/target/
          key: ${{ runner.os }}-cargo-main-${{ hashFiles('native/rust-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-main-

      - name: Setup MSVC Developer Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Compile Native Engines (Windows)
        shell: cmd
        run: |
          cargo build --release --manifest-path native\rust-engine\Cargo.toml
          if exist native\cpp-engine\build rmdir /s /q native\cpp-engine\build
          cmake -B native\cpp-engine\build -S native\cpp-engine -DCMAKE_BUILD_TYPE=Release
          cmake --build native\cpp-engine\build --config Release
          if not exist bin mkdir bin
          copy native\rust-engine\target\release\nano-rp-rust-engine.exe bin\ >nul 2>&1 || ver >nul
          copy native\cpp-engine\build\Release\nano-rp-cpp-engine.exe bin\ >nul 2>&1 || copy native\cpp-engine\build\nano-rp-cpp-engine.exe bin\ >nul 2>&1 || ver >nul

      - name: Install Node Modules
        run: npm ci

      - name: Build and 35-Stage Debloat (Windows)
        shell: cmd
        run: npm run dist:win -- --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-Windows
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

      - name: Publish Windows to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: NanoRp-Creator ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================
  # JOB 2: LINUX INDEPENDENT BUILD & DIRECT RELEASE
  # ========================================================
  build-linux:
    name: Linux x64 (AppImage & Tar.gz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust-engine/target/
          key: ${{ runner.os }}-cargo-main-${{ hashFiles('native/rust-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-main-

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools build-essential libfuse2

      - name: Compile Native Engines (Linux)
        shell: bash
        run: |
          cargo update --manifest-path native/rust-engine/Cargo.toml || true
          cargo build --release --manifest-path native/rust-engine/Cargo.toml || true
          rm -rf native/cpp-engine/build
          cmake -B native/cpp-engine/build -S native/cpp-engine -DCMAKE_BUILD_TYPE=Release || true
          cmake --build native/cpp-engine/build --config Release || true
          mkdir -p bin
          cp native/rust-engine/target/release/nano-rp-rust-engine bin/ || true
          cp native/cpp-engine/build/nano-rp-cpp-engine bin/ || true
          chmod +x bin/* || true

      - name: Install Node Modules
        run: npm ci

      - name: Build and 35-Stage Debloat (Linux)
        shell: bash
        run: npm run dist:linux -- --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-Linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
          retention-days: 14

      - name: Publish Linux to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: NanoRp-Creator ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================
  # JOB 3: MACOS INDEPENDENT BUILD & DIRECT RELEASE
  # ========================================================
  build-macos:
    name: macOS (DMG & Zip)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/rust-engine/target/
          key: ${{ runner.os }}-cargo-main-${{ hashFiles('native/rust-engine/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-main-

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Compile Native Engines (macOS)
        shell: bash
        run: |
          cargo update --manifest-path native/rust-engine/Cargo.toml || true
          cargo build --release --manifest-path native/rust-engine/Cargo.toml || true
          rm -rf native/cpp-engine/build
          cmake -B native/cpp-engine/build -S native/cpp-engine -DCMAKE_BUILD_TYPE=Release || true
          cmake --build native/cpp-engine/build --config Release || true
          mkdir -p bin
          cp native/rust-engine/target/release/nano-rp-rust-engine bin/ || true
          cp native/cpp-engine/build/nano-rp-cpp-engine bin/ || true
          chmod +x bin/* || true

      - name: Install Node Modules
        run: npm ci

      - name: Build and 35-Stage Debloat (macOS)
        shell: bash
        run: npm run dist:mac -- --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-macOS
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14

      - name: Publish macOS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: NanoRp-Creator ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          make_latest: true
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================
  # JOB 4: INDEPENDENT MACOS UI PREVIEW (TESTS)
  # ========================================================
  test-macos:
    name: macOS UI Preview (Playwright)
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright & Dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps

      - name: Capture macOS Screenshots via CDP
        run: |
          python scripts/test_and_capture_screenshots.py

      - name: Upload macOS Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos-preview
          path: screenshots/
          retention-days: 14
